# mccl/configs/model/mixed.yaml

name: mixed

backbone:
  name: dinov2-small
  num_blocks: 10
  frozen: true

manifold:
  type: product
  components:
    - {type: euclidean,   dim: 64}
    - {type: hyperbolic,  dim: 64, curvature: 1.0}
    - {type: sphere,      dim: 64}
  pooling: tangent_mean

predictor:
  hidden: 384
  depth: 2

classifier:
  type: prototype

reg:
  lambda_h: 1.0e-3
  lambda_s: 1.0e-3
  lambda_e: 0.0

jepa:
  n_context: 64
  n_target: 32
  multi_step: 2